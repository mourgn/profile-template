<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A little corner of the internet."><meta name="theme-color" content="#0c1020"><title>Your name — Profile</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body>
<div id="splash" class="splash"><div id="splash-blur" aria-hidden="true"></div><div class="splash-card"><p>Click to enter</p></div></div>
<div id="atmosphere" aria-hidden="true"></div><div id="weather" aria-hidden="true"></div><div id="background" aria-hidden="true"></div><div id="shade" aria-hidden="true"></div><div id="cursor" aria-hidden="true"></div>
<header class="site-header"><button id="customize" class="cross-button" aria-label="Customize profile" title="Customize profile"><svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 3v26M5 12h18"/></svg></button><span id="corner"></span></header>
<main class="stage"><div class="profile"><section class="glass profile-card" aria-label="Profile"><div class="identity"><div id="avatar" class="avatar"></div><div><p id="tagline" class="eyebrow"></p><h1 id="name"></h1><p id="handle" class="muted"></p></div></div><p id="bio" class="bio"></p><p id="location" class="location"></p><div id="link-section"><div class="divider"></div><div id="links" class="links"></div></div><div id="accounts" class="accounts"></div></section><div id="embeds"></div>
<section id="player" class="glass player" aria-label="Music player"><div class="track-heading"><div class="album-art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2"/><ellipse cx="17" cy="15" rx="3" ry="2"/></svg></div><div class="track-copy"><p class="eyebrow">On repeat</p><strong id="song-title">Your soundtrack</strong><span id="song-artist">No tracks yet</span></div><button id="queue-toggle" class="icon-btn" aria-label="Show playlist" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button></div>
<input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek track" disabled><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="player-controls"><button id="repeat" class="icon-btn" aria-label="Repeat all tracks" title="Repeat all"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/></svg></button><div class="transport"><button id="previous" class="icon-btn" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M5 5v14m14-14L8 12l11 7Z"/></svg></button><button id="play" class="play-btn" aria-label="Play music"><svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg></button><button id="next" class="icon-btn" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></svg></button></div><div class="volume"><button id="mute" class="icon-btn" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm4 4q5 4 0 8m3-11q8 7 0 14"/></svg></button><input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume"></div></div><p id="playback-status" class="player-status" role="status"></p><div id="queue" class="queue"></div></section><p id="footnote" class="footnote"></p></div></main><footer id="footer" class="site-footer"></footer><audio id="audio" preload="metadata"></audio>
<dialog id="login-dialog" class="login glass"><form id="login-form"><button type="button" id="login-close" class="close icon-btn" aria-label="Close login">×</button><label class="field">Authenticator code<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" required minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit code"></label><p id="login-error" class="error" role="alert"></p><button id="login-submit" class="primary" type="submit">Unlock</button></form></dialog>
<aside id="editor" class="editor" aria-label="Customization studio" hidden><div class="editor-head"><h2>Customize</h2><button id="editor-close" class="icon-btn" aria-label="Close editor">×</button></div><div class="editor-meta"><span id="save-status" role="status"></span><button id="logout" class="text-btn">Lock</button></div><nav class="tabs" aria-label="Customization sections"><button data-tab="profile" aria-pressed="true">Profile</button><button data-tab="links" aria-pressed="false">Links</button><button data-tab="glass" aria-pressed="false">Profile container</button><button data-tab="music" aria-pressed="false">Music container</button><button data-tab="media" aria-pressed="false">Media</button><button data-tab="settings" aria-pressed="false">More</button></nav><div id="fields" class="editor-fields"></div><div class="editor-actions"><div class="row"><button id="save-draft" class="secondary">Save draft</button><button id="publish" class="primary">Publish</button></div></div></aside>
<div id="notice" class="notice" role="status" hidden></div><input id="import-file" type="file" accept="application/json,.json" hidden>
</body></html>
